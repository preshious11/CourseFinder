services:
  bot:
    build: .
    env_file:
      - .env
    # Keep the SQLite file on the volume but leave the code in the image: mounting
    # the volume at /app would mask every rebuilt image with the first deploy's
    # source tree.
    environment:
      DB_PATH: /data/bot.db
    volumes:
      - bot-data:/data
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
